<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Clipboard Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 15 15 4a2 2 0 0 1 5 5L9 20l-6 1zM4 15l5 5M12 21h9"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 7 4 4v2H6v-2l4-4zM12 16v6"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="6" width="12" height="15" rx="2"/><path d="M15 6V4a1 1 0 0 0-1-1H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M11 10h6M11 14h6M11 18h4"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1v15M6 7h3M6 10h3M6 13h3M16 7h3M16 10h3"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 9v8M14 9v8"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 18 6-6 4 4 3-4 6 6"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v5c0 5-4 9-8 11-4-2-8-6-8-11V6z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 3 2 2 1-1 3v6l1 3-2 1-3 2-1 2h-4l-1-2-3-2-2-1 1-3V9L4 6l2-1z"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </defs></svg>
  <main class="panel">
    <div class="search-box"><svg><use href="#icon-search"/></svg><input id="search-input" type="search" placeholder="Aramak için buraya yaz…" aria-label="Geçmişte ara" autocomplete="off" spellcheck="false"></div>
    <div id="notice" role="status" hidden></div>
    <div id="history" aria-label="Pano geçmişi"></div>
    <div id="empty" hidden><svg><use href="#icon-copy"/></svg><strong>Panonuz burada.</strong><p>Kopyaladığınız metinler ve görseller<br>bu listede görünecek.</p><span>Ctrl + Shift + V ile hızlıca açın</span></div>
    <footer>
      <button id="pause" class="footer-row" role="switch" aria-checked="false"><svg><use href="#icon-shield"/></svg><span>Gizli kip</span><span class="switch"><span></span></span></button>
      <button id="settings" class="footer-row"><svg><use href="#icon-settings"/></svg><span>Ayarlar</span></button>
      <button id="clear" class="footer-row"><svg><use href="#icon-trash"/></svg><span>Geçmişi temizle</span></button>
    </footer>
  </main>
  <dialog id="modal" aria-labelledby="modal-title">
    <div class="dialog-header"><h1 id="modal-title"></h1><button id="dismiss" class="icon-button" title="Kapat" aria-label="Kapat"><svg><use href="#icon-close"/></svg></button></div>
    <div id="modal-body"></div>
    <div class="dialog-actions" id="modal-actions"></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
